
[package]
name = "gearhash-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.gearhash]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "neon"
path = "fuzz_targets/neon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "avx2"
path = "fuzz_targets/avx2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sse42"
path = "fuzz_targets/sse42.rs"
test = false
doc = false
bench = false
